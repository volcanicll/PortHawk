name: Release

# Triggered by pushing a v* tag: inject version -> build -> package DMG/zip ->
# create the GitHub Release. The landing page picks up the new version from the
# Releases API at runtime, so it never needs redeploying.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Resources/Info.plist

      - name: Build
        run: ./build.sh

      - name: Self-test the data layer
        run: ./build/PortHawk.app/Contents/MacOS/PortHawk --selftest

      - name: Verify deployment target
        run: |
          # Refuse to ship a binary that requires a newer macOS than we
          # advertise — this is how a newer runner SDK silently raises the floor.
          MINOS=$(otool -l build/PortHawk.app/Contents/MacOS/PortHawk \
            | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          ADVERTISED=$(plutil -extract LSMinimumSystemVersion raw build/PortHawk.app/Contents/Info.plist)
          echo "minos=$MINOS advertised=$ADVERTISED"
          [ "$MINOS" = "$ADVERTISED" ] || {
            echo "!! binary requires macOS $MINOS but Info.plist advertises $ADVERTISED" >&2
            exit 1
          }

      - name: Build the DMG
        run: |
          # Drag-to-install layout: the app plus an /Applications symlink, so a
          # single drag from the mounted volume installs it.
          mkdir -p dmg-staging
          ditto build/PortHawk.app dmg-staging/PortHawk.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "PortHawk $VERSION" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "PortHawk-$VERSION-arm64.dmg"

      - name: Build the zip
        run: |
          cd build
          ditto -c -k --keepParent PortHawk.app "../PortHawk-$VERSION-arm64.zip"

      - name: Add unversioned copies
        run: |
          # install.sh resolves releases/latest/download/<fixed name>, which
          # avoids the anonymous GitHub API rate limit.
          cp "PortHawk-$VERSION-arm64.dmg" "PortHawk-arm64.dmg"
          cp "PortHawk-$VERSION-arm64.zip" "PortHawk-arm64.zip"

      - name: Verify artifacts
        run: |
          ls -lh PortHawk-*.dmg PortHawk-*.zip
          hdiutil imageinfo "PortHawk-$VERSION-arm64.dmg" > /dev/null && echo "DMG verified"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PortHawk $GITHUB_REF_NAME" \
            --generate-notes \
            "PortHawk-$VERSION-arm64.dmg" \
            "PortHawk-$VERSION-arm64.zip" \
            "PortHawk-arm64.dmg" \
            "PortHawk-arm64.zip"
